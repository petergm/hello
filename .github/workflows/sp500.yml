name: S&P 500 strategier

on:
  push:
    branches: [claude/new-session-lmpuzq]
    paths:
      - sp500/sp500_strategies.py
      - .github/workflows/sp500.yml
  schedule:
    - cron: "23 22 1 * *"   # månedligt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sp500
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - name: Hent data
        run: python sp500/sp500_strategies.py fetch
      - name: Backtest
        run: python sp500/sp500_strategies.py backtest
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add sp500/data
          git diff --cached --quiet && exit 0
          git commit -m "S&P 500: data og backtest $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
